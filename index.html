<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>포카 체커 (Phoca Checker) - 포토카드 체크리스트 & 위시리스트 생성기</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </div>
      <h1 class="brand-title">포카 체커 (Phoca Checker)</h1>
    </div>

    <div class="header-actions">
      <label for="custom-image-upload" class="btn btn-sm" title="내 이미지 불러오기">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        이미지 열기
      </label>
      <input type="file" id="custom-image-upload" accept="image/*" style="display: none;">

      <button id="toggle-editor-btn" class="btn btn-sm" title="영역 편집 / 신규 템플릿 제작 도구">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        영역 편집기
      </button>
    </div>
  </header>

  <main class="app-main">
    <!-- Top Control Bar -->
    <section class="control-bar">
      <!-- 1. Template Select -->
      <div class="control-group">
        <span class="group-label">포카 리스트</span>
        <div class="select-wrapper">
          <select id="template-select" class="styled-select"></select>
          <div class="select-arrow">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <!-- 2. Display Mode Toggle (Inversion) -->
      <div class="control-group">
        <span class="group-label">표시 모드</span>
        <div class="segmented-control">
          <button id="mode-hide-owned" class="seg-btn active" title="보유한 포카를 회색으로 가려 미보유 위시리스트 강조">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            보유 포카 가리기
          </button>
          <button id="mode-hide-unowned" class="seg-btn" title="미보유 포카를 회색으로 가려 보유 컬렉션 강조">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            미보유 포카 가리기
          </button>
        </div>
      </div>

      <!-- 3. Bulk Selection Actions -->
      <div class="control-group">
        <button id="btn-select-all" class="btn btn-sm" title="모두 보유로 선택">전체 선택</button>
        <button id="btn-deselect-all" class="btn btn-sm" title="선택 모두 초기화">전체 해제</button>
        <button id="btn-invert-selection" class="btn btn-sm" title="선택 상태 반전">반전</button>
      </div>

      <!-- 4. Export PNG Button -->
      <div class="control-group">
        <button id="btn-export-png" class="btn btn-success" title="완성된 체크리스트 고화질 이미지 다운로드">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          이미지 다운로드 (PNG)
        </button>
      </div>
    </section>

    <!-- Stats Bar -->
    <section class="stats-bar">
      <div class="stat-info">
        <span>보유 현황:</span>
        <span id="stat-count" class="stat-badge">0 / 0 장</span>
        <span id="stat-percent" class="stat-percent">(0%)</span>
      </div>
      <div class="progress-track">
        <div id="progress-bar-fill" class="progress-fill"></div>
      </div>
    </section>

    <!-- Visual Editor Drawer (Admin/Creator tool) -->
    <section id="editor-drawer" class="editor-drawer">
      <div class="editor-header">
        <h3>🛠️ 포토카드 영역 편집기 (그리드 생성 & 미세조정)</h3>
        <button id="close-editor-btn" class="btn btn-sm">닫기</button>
      </div>

      <div class="form-field" style="margin-bottom: 1rem;">
        <label>템플릿 제목</label>
        <input type="text" id="editor-template-title" value="새 템플릿">
      </div>

      <h4 style="font-size: 0.85rem; color: #a5b4fc; margin-bottom: 0.5rem;">⚡ 1-Click 그리드 일괄 생성</h4>
      <div class="editor-grid-form">
        <div class="form-field">
          <label>행 (Rows)</label>
          <input type="number" id="grid-rows" value="1" min="1" max="10">
        </div>
        <div class="form-field">
          <label>열 (Cols)</label>
          <input type="number" id="grid-cols" value="4" min="1" max="10">
        </div>
        <div class="form-field">
          <label>시작 X (%)</label>
          <input type="number" id="grid-start-x" value="7.9" step="0.1">
        </div>
        <div class="form-field">
          <label>시작 Y (%)</label>
          <input type="number" id="grid-start-y" value="48.8" step="0.1">
        </div>
        <div class="form-field">
          <label>카드 가로 (%)</label>
          <input type="number" id="grid-card-w" value="18.4" step="0.1">
        </div>
        <div class="form-field">
          <label>카드 세로 (%)</label>
          <input type="number" id="grid-card-h" value="42.5" step="0.1">
        </div>
        <div class="form-field">
          <label>가로 간격 (%)</label>
          <input type="number" id="grid-gap-x" value="3.5" step="0.1">
        </div>
        <div class="form-field">
          <label>세로 간격 (%)</label>
          <input type="number" id="grid-gap-y" value="4.0" step="0.1">
        </div>
        <div class="form-field">
          <label>모서리 둥글기 (px)</label>
          <input type="number" id="grid-radius" value="12" min="0" max="40">
        </div>
      </div>

      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
        <button id="btn-generate-grid" class="btn btn-primary btn-sm">⚡ 그리드 생성</button>
        <button id="btn-add-box" class="btn btn-sm">+ 개별 박스 추가</button>
        <button id="btn-delete-box" class="btn btn-sm">선택 박스 삭제</button>
        <button id="btn-clear-boxes" class="btn btn-sm">전체 초기화</button>
        <button id="btn-apply-template" class="btn btn-success btn-sm">현재 화면에 적용</button>
      </div>

      <div class="form-field">
        <label>생성된 JSON 설정 데이터 (templates.js 복사용)</label>
        <textarea id="editor-json-output" class="json-textarea" readonly></textarea>
        <div style="margin-top: 0.5rem;">
          <button id="btn-copy-json" class="btn btn-sm">📋 JSON 복사하기</button>
        </div>
      </div>
    </section>

    <!-- Main Photocard Canvas Viewport -->
    <section class="canvas-section">
      <div id="image-wrapper" class="image-wrapper">
        <img id="main-sheet-image" class="main-image" src="" alt="포토카드 리스트 이미지">
        <div id="card-overlay-container" class="card-overlay-container"></div>
      </div>
    </section>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/templates.js"></script>
  <script src="js/canvas-export.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
